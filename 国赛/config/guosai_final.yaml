runtime:
  logs_root: logs
  default_log_prefix: final
  dry_run: false

slam:
  map_path: /home/jetson/Desktop/guosai/slam_maps/guosai_rgbd_map_v4.osa
  settings_yaml: /home/jetson/Desktop/guosai/slam_maps/guosai_realsense_rgbd_localization_v4.yaml
  vocabulary_path: ${GUOSAI_ROOT}/controller/ORB_SLAM3/Vocabulary/ORBvoc.txt
  waypoints_yaml: /home/jetson/Desktop/guosai/slam_maps/waypoints_FINAL.yaml
  pose_topic: /camera_pose
  # watchdog 仲裁后的融合位姿话题（SLAM 主源 + AprilTag 兜底），navigator 订阅它
  fused_pose_topic: /camera_pose_fused
  pose_type: pose_stamped
  stable_samples: 15
  stable_max_position_step: 0.08
  stable_max_yaw_step: 0.35
  pose_timeout_sec: 0.8
  jump_position_threshold: 0.45
  jump_yaw_threshold: 1.2
  # 朝向提取约定 (与 navigation 段一致): z-euler yaw 在 xz 地面系退化, 必须用前向向量投影
  ground_plane: xz
  forward_axis: z

realsense:
  color_topic: /camera/camera/color/image_raw
  depth_topic: /camera/camera/aligned_depth_to_color/image_raw
  color_info_topic: /camera/camera/color/camera_info
  # 必须显式指定 color/depth profiles —— 否则 color 话题静默消失,
  # ORB-SLAM3 等不到 color+depth 同步 → /camera_pose 不发布 → SLAM 无信息
  # (2026-08-15 现场验证, 见 deploy.md)
  command: >-
    ros2 launch realsense2_camera rs_launch.py
    enable_color:=true
    enable_depth:=true
    enable_infra1:=false
    enable_infra2:=false
    align_depth.enable:=true
    pointcloud.enable:=false
    rgb_camera.color_profile:=640x480x15
    depth_module.depth_profile:=640x480x15

orbslam3:
  # 地图通过 settings yaml 的 System.LoadAtlasFromFile 加载（如 guosai_rgbd_map_v4），
  # 不要在此传第 3 个 .osa 参数——rgbd wrapper 只接受 vocab + settings 两个位置参数，
  # 多传的 .osa 会被误当 session 文件，导致 pose 恒为 0（tracking 未建立/地图未正确加载）。
  command: >-
    ros2 run orbslam3 rgbd
    ${GUOSAI_ROOT}/controller/ORB_SLAM3/Vocabulary/ORBvoc.txt
    /home/jetson/Desktop/guosai/slam_maps/guosai_realsense_rgbd_localization_v4.yaml
    --ros-args
    -p color_encoding:=bgr8
    -r /camera/color/image_raw:=/camera/camera/color/image_raw
    -r /camera/aligned_depth_to_color/image_raw:=/camera/camera/aligned_depth_to_color/image_raw

tag_localizer:
  # AprilTag 绝对定位兜底。tag 世界坐标必须先用 tools/calibrate_tags.py 现场标定，
  # 否则 enabled 保持 false（占位坐标会输出错误位姿）。
  enabled: false            # 标定完成并验证后置 true
  fallback_enabled: true    # watchdog 是否允许切到 tag 源（enabled=false 时自动失效）
  tags_yaml: ${GUOSAI_ROOT}/config/tags.yaml
  pose_topic: /tag_localizer/pose
  status_topic: /tag_localizer/status
  seen_tags_topic: /tag_localizer/seen_tags
  frame_id: map
  detect_hz: 10.0
  min_decision_margin: 12.0
  # --- watchdog 仲裁参数 ---
  tag_timeout_sec: 1.0        # tag 位姿新鲜度窗口
  tag_stable_samples: 3       # tag 源稳定所需连续帧（比 SLAM 短，兜底要快）
  switch_suppress_sec: 2.5    # 源切换迟滞窗口，防 slam/tag 乒乓
  slam_distrust_sec: 2.0      # SLAM 跳变后的不信任窗口
  fault_grace_sec: 0.5        # 双源全丢的宽限期，超过才判故障

motion:
  receiver_host: 127.0.0.1
  receiver_port: 5005
  send_hz: 10.0
  nav_cmd_topic: /motion/nav_cmd
  avoid_cmd_topic: /motion/avoid_cmd
  stop_topic: /motion/stop
  mux_state_topic: /motion_mux/state
  max_cmd_age_sec: 0.6
  max_vx: 0.35
  max_vy: 0.15
  max_wz: 0.55
  obstacle_priority: true

navigation:
  goal_topic: /waypoint/goal
  status_topic: /waypoint/status
  cmd_topic: /motion/nav_cmd
  goal_tolerance: 0.16
  yaw_tolerance: 0.22
  kp_linear: 0.45
  kp_angular: 1.2
  max_vx: 0.28
  max_wz: 0.45
  rotate_in_place_angle: 0.75
  # ORB 世界系地面平面 x-z (y 近似竖直); 航向 atan2(dz,dx) 与航点 yaw 同约定。
  ground_plane: xz
  # /camera_pose 姿态的前向轴: z=光学相机(默认), x=ROS body。朝向恒差 90° 时切换。
  forward_axis: z
  # 若上机发现转向方向相反(该左转时右转), 改为 -1.0。
  turn_sign: 1.0

cone_avoidance:
  enabled_topic: /motion/enable_cone_avoidance
  cmd_topic: /motion/avoid_cmd
  model: ${GUOSAI_ROOT}/cone_avoidance/scripts/cone_yolo_best.pt
  camera: "0"
  conf: 0.35
  send_hz: 10.0
  no_display: true
  # --- LocalPlanner 引导式避障（方案甲，正式链路）---
  # global_path 锚点（障碍区 起始/中间/末尾 3 个 AprilTag 坐标，标定后填入）
  # 与 obstacle_zone_rect（边界约束）定义在 competition_map.yaml
  control_yaml: ${GUOSAI_ROOT}/cone_avoidance/config/control.yaml
  map_config: ${GUOSAI_ROOT}/cone_avoidance/competition_map.yaml
  pose_topic: /camera_pose_fused        # 用 watchdog 融合位姿（SLAM + AprilTag 兜底）
  depth_topic: /camera/camera/aligned_depth_to_color/image_raw
  depth_info_topic: /camera/camera/aligned_depth_to_color/camera_info
  # ORB 世界系地面平面 x-z (y 竖直); 前向轴 z=光学相机。与 navigation 段同约定。
  ground_plane: xz
  forward_axis: z

inspection:
  # 正式链路用 7 类模型(live_detect.py + best_7class.pt)。
  # 5 类版本(live_detect_yolo_opencv.py + best.pt)已淘汰——单独测试效果差。
  # 相机源: 巡检相机 = RealSense(video2-7), 与 SLAM 共用同一相机。
  # video2-7 被 realsense2_camera 占用(保护进程, 不能 kill) → 巡检必须订阅
  # ROS 话题 /camera/camera/color/image_raw 共用图像, 零冲突。
  # video0(USB Camera)= Astra 抓取用, 与巡检无关。
  live_detect_command: >-
    python3 live_detect.py
    --model ${GUOSAI_ROOT}/best_7class.pt
    --color-topic /camera/camera/color/image_raw
    --no-gui
    --no-stream
  bridge_log_path: output/integration_bridge/final_events.jsonl
  required_boxes: [inspection_box_1_side_1, inspection_box_1_side_2, inspection_box_2_side_1, inspection_box_2_side_2]
  wait_timeout_sec: 45.0
  per_waypoint_wait_sec: 5.0
  result_topic: /inspection/all
  target_topic: /inspection/target_zones

arm:
  grasp_config: ${GUOSAI_ROOT}/arm_grasp/config/grasp_config.yaml
  use_services: true
  grasp_service: /arm/grasp_red_bar
  place_service_prefix: /arm/place_
  direct_grasp_topic: /task/direct_grasp
  arm_command_topic: /arm/command
  # 放置区字母识别模型（7 类 YOLO，与巡检同款；vision_node 用）
  zone_model_path: ${GUOSAI_ROOT}/best_7class.pt
  # 放置区字母识别结果 topic（必须与 vision_node 的 zone_topic 完全一致，否则 FSM 收不到结果）
  zone_topic: /placement/recognized_zone
  feedback_topic: /arm/feedback
  max_retries: 3
  feedback_timeout_sec: 20.0
  # --- 抓取视觉相机: Astra(2026-08-15 确认, 抓取用 Astra, 巡检用 RealSense)---
  # astra_camera_node 打开 /dev/video0(Astra RGB 2bc5:0511)+ OpenNI2 深度 → /rgbd_cam/*
  # 巡检 live_detect 走 /dev/video4(RealSense), 两者不冲突。
  camera_index: 0                 # Astra RGB 设备号(/dev/video0)
  depth_mode: auto                # auto | pyorbbec | openni | uvc | realsense | none(真实深度后端)
  depth_index: -1                 # UVC 深度设备号, -1=默认 camera_index+1
  fake_depth_fallback: false      # 深度不可用时禁止回退伪深度(正式比赛必须 false)
  openni_redist: ""               # OpenNI2 Redist 路径(空=自动探测 ~/openni2/OpenNI-Linux-*/Redist)
  openni_fx: 945.028
  openni_fy: 945.028
  openni_cx: 320.0
  openni_cy: 400.0
  # realsense 兜底转发(仅 depth_mode=realsense 时用, 当前 auto 不会走)
  realsense_color_topic: /camera/camera/color/image_raw
  realsense_depth_topic: /camera/camera/aligned_depth_to_color/image_raw
  realsense_info_topic: /camera/camera/color/camera_info

voice_broadcast:
  enabled: true
  audio_dir: ${GUOSAI_ROOT}/output/audio
  engine: aplay           # mock | aplay | ffplay  (Jetson 现场用 aplay)
  gap_sec: 0.4
  result_topic: /inspection/all              # 兜底（abnormal/normal，无法区分偏低/偏高）
  detailed_topic: /inspection/all_detailed   # 主用（low/normal/high，保留偏低/偏高）
  state_topic: /competition/state
  playback_log_path: ${GUOSAI_ROOT}/output/voice_broadcast/playback.tsv
  # 仪表盘结果记忆存储文件：播报 A/B/C/D 状态时同步写入（黄/红=异常，绿=正常），
  # 供夹取-放置阶段查询哪些箱子异常；新一轮比赛前发 /inspection/gauge_memory_reset 清空
  memory_path: ${GUOSAI_ROOT}/output/gauge_memory.json
  device: "plughw:2,0"   # aplay 声卡 (C-Media USB Audio = card 2, device 0, 2026-08-15 现场实测)

fsm:
  start_waypoint: start_exit
  obstacle_entry_waypoint: obstacle_entry
  obstacle_exit_waypoint: obstacle_exit
  inspection_waypoints: [inspection_box_1_side_1, inspection_box_1_side_2, inspection_box_2_side_1, inspection_box_2_side_2]
  pick_waypoint: pick_area
  place_waypoints:
    A: place_A
    B: place_B
    C: place_C
    D: place_D
  final_waypoint: finish
  max_abnormal_zones: 2
  nav_timeout_sec: 60.0
  # 2026-08-15 容错策略: 任何子模块小问题跳过继续, 不卡死主流程
  # - max_abnormal_zones=2: 允许抓取; 抓取失败(grasp_*/arm_action_failed)自动跳过该箱继续
  # - nav_timeout_sec=60: 某航点 60s 未到达 → 跳过继续(不卡在 GO_* 状态)
  # - 定位丢失(localization_lost)仍 ERROR 安全停(狗不能乱走)
  # 巡检相机递增回退已在 live_detect.py; astra 深度失败由 --no-arm 或失败跳过兜底
  # 放置区字母确认：到达放置区后先识别字母，与记忆中的异常目标一致才松爪；
  # false 退化为纯航点对齐（原行为）
  place_visual_confirm: true
  auto_start: true
